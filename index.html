
<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIRE 現金流 v2</title>
<style>
body{font-family:Arial;background:#f3f5f7;margin:0;padding:16px}
h2{margin-top:0}
.wrap{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.15);margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:5px}
th{background:#eef3f8}input,select{width:100%;box-sizing:border-box}
button{margin:6px 0}.good{color:green}.bad{color:#c00}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style></head><body>
<h2>FIRE 財務規劃 v2</h2>
<div class="wrap">
<div id="forms"></div>
<div>
<div class="card"><h3>摘要</h3><div id="summary"></div></div>
<div class="card"><h3>年度模擬</h3>
起始年齡 <input id="age" type="number" value="39">
<input type="checkbox" id="save" checked> 自動儲存
<div id="sim"></div>
</div></div></div>
<script>
const defs={
資產:["台股","美股","勞退","外幣","房產","其他"],
收入:["薪資","獎金","配息","租金","其他"],
負債:["房貸","信貸","其他"],
支出:["餐費","生活","娛樂","保險","房貸","其他"]
};
const seed={
資產:[["台股",550],["台股",330],["美股",75],["勞退",80],["外幣",3],["房產",1400]],
收入:[["薪資",9,"月"],["獎金",45,"年"],["配息",2,"季"]],
負債:[["房貸",1048]],
支出:[["餐費",2,"月"],["生活",0.3,"月"],["娛樂",0.3,"月"],["保險",2.5,"年"],["房貸",3.4,"月"]]
};
function build(sec,freq){
let h='<div class="card"><h3>'+sec+'</h3><table id="'+sec+'"><tr><th>名稱</th><th>金額(萬)</th>';
if(freq)h+='<th>頻率</th>';h+='</tr>';
(seed[sec]||[]).forEach(r=>h+=row(sec,freq,r));
h+='</table><button onclick="addRow(\''+sec+'\','+freq+')">新增一行</button></div>';
return h;
}
function row(sec,freq,r=[]){
let s='<tr><td><select>';
defs[sec].forEach(v=>s+='<option '+(v==r[0]?'selected':'')+'>'+v+'</option>');
s+='</select></td><td><input type=number value="'+(r[1]||0)+'"></td>';
if(freq){
let f=r[2]||'月';
s+='<td><select>';
['月','季','年'].forEach(x=>s+='<option '+(x==f?'selected':'')+'>'+x+'</option>');
s+='</select></td>';
}
return s+'</tr>';
}
forms.innerHTML=build('資產',false)+build('收入',true)+build('負債',false)+build('支出',true);
function addRow(s,f){document.querySelector('#'+CSS.escape(s)).insertAdjacentHTML('beforeend',row(s,f));bind();}
function annual(v,f){return f=='月'?v*12:f=='季'?v*4:v;}
function calc(){
let a=0,d=0,i=0,e=0;
document.querySelectorAll('#資產 tr').forEach((r,n)=>{if(n)a+=+r.querySelector('input').value||0});
document.querySelectorAll('#負債 tr').forEach((r,n)=>{if(n)d+=+r.querySelector('input').value||0});
document.querySelectorAll('#收入 tr').forEach((r,n)=>{if(n){let c=r.querySelectorAll('input,select');i+=annual(+c[1].value||0,c[2].value)}});
document.querySelectorAll('#支出 tr').forEach((r,n)=>{if(n){let c=r.querySelectorAll('input,select');e+=annual(+c[1].value||0,c[2].value)}});
let net=a-d,flow=i-e,need=e*25,fire=net>=need;
summary.innerHTML='<table>'+
'<tr><td>淨資產</td><td>'+net.toFixed(1)+'萬</td></tr>'+
'<tr><td>年收入</td><td>'+i.toFixed(1)+'萬</td></tr>'+
'<tr><td>年支出</td><td>'+e.toFixed(1)+'萬</td></tr>'+
'<tr><td>年現金流</td><td>'+flow.toFixed(1)+'萬</td></tr>'+
'<tr><td>FIRE需求</td><td>'+need.toFixed(1)+'萬</td></tr>'+
'<tr><td>狀態</td><td class="'+(fire?'good':'bad')+'">'+(fire?'✅ 已達成':'❌ 未達成')+'</td></tr></table>';
let age=+document.getElementById('age').value;
let asset=net;
let out='<table><tr><th>年齡</th><th>淨資產</th><th>FIRE</th></tr>';
let fireAge='-';
for(let y=age;y<=100;y++){
asset+=flow;
let ok=asset>=need;
if(ok&&fireAge=='-')fireAge=y;
out+='<tr><td>'+y+'</td><td>'+asset.toFixed(0)+'</td><td>'+(ok?'✅':'')+'</td></tr>';
}
out+='</table><p><b>預估 FIRE 年齡：'+fireAge+'</b></p>';
sim.innerHTML=out;
if(save.checked){
localStorage.setItem('firev2',document.body.innerHTML);
}
}
function bind(){document.querySelectorAll('input,select').forEach(x=>x.oninput=calc);calc();}
bind();
</script></body></html>
